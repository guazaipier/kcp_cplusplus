version: '3'
services:
  kcp_server:
    build: server/.
    # 从 Dockerfile 当前目录中构建镜像
    ports:
      - "12345:12345/udp"
      # 将容器的 12345 端口映射到主机的 12345 端口，默认 tcp
    volumes:
      - /opt/run:/opt/run
    ulimits:
      nofile:
        soft: 20000
        hard: 65536
    labels:
      - "kcp_server.description=kcp server"
    restart: always
  kcp_client:
    build: client/.
    # 从 client/Dockerfile 当前目录中构建镜像
    volumes:
      - /opt/run:/opt/run
    labels:
      - "kcp_client.description=kcp client"
    # 使 client 容器可以访问主机端口
    network_mode: "host"
    # 确保 server 端启动就绪
    command: sh -c "sleep 3 && ./main"
    